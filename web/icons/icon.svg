<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18132e"/>
      <stop offset="70%" stop-color="#0c0a17"/>
      <stop offset="100%" stop-color="#07060b"/>
    </radialGradient>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ring2-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Outer ambient glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-grad)"/>

  <!-- Orbit Ring 1 -->
  <ellipse cx="256" cy="256" rx="160" ry="85" fill="none" stroke="url(#ring1-grad)" stroke-width="4.5" stroke-dasharray="14 10" transform="rotate(-30 256 256)" opacity="0.85" filter="url(#glow-blur)"/>

  <!-- Orbit Ring 2 -->
  <ellipse cx="256" cy="256" rx="160" ry="85" fill="none" stroke="url(#ring2-grad)" stroke-width="4.5" stroke-dasharray="18 12" transform="rotate(45 256 256)" opacity="0.85" filter="url(#glow-blur)"/>

  <!-- Central Glowing Energy Core -->
  <circle cx="256" cy="256" r="75" fill="url(#core-grad)" filter="url(#glow-blur)"/>
  
  <!-- Sparkles & Particles -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.95"/>
  <circle cx="340" cy="180" r="6" fill="#06b6d4" filter="url(#glow-blur)"/>
  <circle cx="170" cy="330" r="5" fill="#a78bfa" filter="url(#glow-blur)"/>
  <circle cx="330" cy="320" r="4.5" fill="#10b981" filter="url(#glow-blur)"/>
  <circle cx="180" cy="190" r="4" fill="#ec4899" filter="url(#glow-blur)"/>

  <!-- Martha 'M' Monogram Stylized Symbol -->
  <path d="M 216 280 L 216 235 L 240 260 L 256 244 L 272 260 L 296 235 L 296 280" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
